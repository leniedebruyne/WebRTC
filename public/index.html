<!-- client code, desktop -->

<!DOCTYPE html>
<html>

<head>
    <title>WebRTC Desktop</title>
    <style>
        .cursor {
            position: absolute;
            width: 3rem;
            height: 3rem;
            background: red;
            border-radius: 50%;
            transition: all 0.05s linear;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="qrContainer">
        <p id="status">Scan QR code met je gsm</p>
        <div id="qr"></div>
        <a id="url" target="_blank"></a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <script>
        const socket = io();

        const $url = document.getElementById('url');
        const $status = document.getElementById('status');
        const $qrContainer = document.getElementById('qrContainer');

        let peer = null;
        let cursor = null;
        let currentControllerId = null;

        // QR genereren wanneer desktop connect
        socket.on('connect', () => {

            const url = `${window.location.origin}/controller.html?id=${socket.id}`;

            $url.textContent = url;
            $url.href = url;

            const qr = qrcode(4, 'L');
            qr.addData(url);
            qr.make();
            document.getElementById('qr').innerHTML = qr.createImgTag(4);
        });

        // Signalling via socket
        socket.on('signal', ({ senderId, signal }) => {

            currentControllerId = senderId;

            // Maak peer enkel aan bij eerste connect
            if (!peer) {
                peer = new SimplePeer({
                    initiator: false,
                    trickle: true
                });

                // Stuur signalling data terug
                peer.on('signal', data => {
                    socket.emit('signal', {
                        targetId: currentControllerId,
                        signal: data
                    });
                });

                // Wanneer data binnenkomt (cursor)
                peer.on('data', data => {
                    const { x, y } = JSON.parse(data);

                    if (!cursor) {
                        cursor = document.createElement('div');
                        cursor.classList.add('cursor');
                        document.body.appendChild(cursor);
                    }

                    cursor.style.left = `${x * window.innerWidth}px`;
                    cursor.style.top = `${y * window.innerHeight}px`;
                });

                peer.on('connect', () => {
                    $status.textContent = "Controller connected!";
                    $qrContainer.style.display = "none";
                });

                peer.on('close', () => {
                    location.reload(); // reset naar QR
                });
            }

            peer.signal(signal);
        });
    </script>
</body>

</html>
