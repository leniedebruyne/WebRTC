<!-- client code, desktop -->

<!DOCTYPE html>
<html>

<head>
    <title>WebRTC Desktop</title>
    <style>
        .cursor {
            position: absolute;
            width: 3rem;
            height: 3rem;
            background: red;
            border-radius: 50%;
            transition: all 0.05s linear;
        }


        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to top, #65A9E7, #D7ECFE);
            font-family: 'Arial', sans-serif;
        }

        #qrContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #65A9E7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #qrContainer p {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .game {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 200px;
            font-size: 45px;
            color: #333;
            background: rgba(248, 250, 254, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }

        .balloon {
            position: absolute;
            width: 80px;
            height: 120px;
        }

        .bird {
            position: absolute;
            width: 60px;
            height: auto;
            transition: transform 0.2s linear;
        }

        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            bottom: -150px;
            width: 283px;
            height: 131px;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;

            transform-origin: bottom center;
            transform: scale(var(--scale, 1));
        }

        @keyframes rise {
            from {
                transform: scale(var(--scale, 1)) translateY(0);
            }

            to {
                transform: scale(var(--scale, 1)) translateY(-130vh);
            }
        }
    </style>
</head>

<body>
    <div id="qrContainer">
        <p id="status">Scan QR code met je gsm</p>
        <div id="qr"></div>
        <a id="url" target="_blank"></a>
    </div>

    <div class="game">
        <!-- UI -->
        <div class="hud">
            <span class="time">Time: 00:00</span>
            <span class="best">Best time: 00:00</span>
        </div>
        <!-- Wolken-container -->
        <div class="clouds"></div>
        <!-- Ballon -->
        <div class="balloon"> <img src="/assets/Balloon.svg" alt="balloon"> </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <script>
        const socket = io();

        const $url = document.getElementById('url');
        const $status = document.getElementById('status');
        const $qrContainer = document.getElementById('qrContainer');

        let peer = null;
        let cursor = null;
        let currentControllerId = null;

        const balloon = document.querySelector('.balloon');


        // QR genereren wanneer desktop connect
        socket.on('connect', () => {

            const url = `${window.location.origin}/controller.html?id=${socket.id}`;

            $url.textContent = url;
            $url.href = url;

            const qr = qrcode(4, 'L');
            qr.addData(url);
            qr.make();
            document.getElementById('qr').innerHTML = qr.createImgTag(4);
        });

        // Signalling via socket
        socket.on('signal', ({ senderId, signal }) => {

            currentControllerId = senderId;

            // Maak peer enkel aan bij eerste connect
            if (!peer) {
                peer = new SimplePeer({
                    initiator: false,
                    trickle: true
                });

                // Stuur signalling data terug
                peer.on('signal', data => {
                    socket.emit('signal', {
                        targetId: currentControllerId,
                        signal: data
                    });
                });




                // 1x initial position
                balloon.style.left = `${window.innerWidth / 2 - balloon.offsetWidth / 2}px`;
                balloon.style.top = `${window.innerHeight / 2 - balloon.offsetHeight / 2}px`;

                // Wanneer data binnenkomt (cursor)
                peer.on('data', data => {
                    const { x, y } = JSON.parse(data);

                    const screenWidth = window.innerWidth;
                    const screenHeight = window.innerHeight;

                    const balloonWidth = balloon.offsetWidth;
                    const balloonHeight = balloon.offsetHeight;

                    const newX = x * screenWidth - balloonWidth / 2;
                    const newY = y * screenHeight - balloonHeight / 2;

                    const clampedX = Math.max(0, Math.min(screenWidth - balloonWidth, newX));
                    const clampedY = Math.max(0, Math.min(screenHeight - balloonHeight, newY));

                    balloon.style.left = `${clampedX}px`;
                    balloon.style.top = `${clampedY}px`;
                });

                peer.on('connect', () => {
                    $status.textContent = "Controller connected!";
                    $qrContainer.style.display = "none";
                });

                peer.on('close', () => {
                    location.reload(); // reset naar QR
                });

                // test ziek eerst de qr code en als die scant pas de ui?
                peer.on('connect', () => {
                    $status.textContent = "Controller connected!";
                    $qrContainer.style.display = "none";

                    const gameDiv = document.querySelector('.game');
                    gameDiv.style.display = "block"; // show de game

                    startClouds();
                    startTimer();
                });
            }

            peer.signal(signal);
        });
    </script>

    <script src="/js/desktop.js"></script>

</body>

</html>
