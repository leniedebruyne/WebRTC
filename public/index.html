<!-- client code, desktop -->

<!DOCTYPE html>
<html>

<head>
    <title>WebRTC Desktop</title>
    <link rel="stylesheet" href="/css/desktop.css">
</head>

<body>
    <div id="qrContainer">
        <p id="status">Scan QR code met je gsm</p>
        <div id="qr"></div>
        <a id="url" target="_blank"></a>
    </div>

    <div class="game">
        <!-- UI -->
        <div class="hud">
            <span class="time">Time: 00:00</span>
            <span class="best">Best time: 00:00</span>
            <div class="lives"> ❤️ ❤️ ❤️ </div>
        </div>
        <!-- Wolken-container -->
        <div class="clouds"></div>
        <!-- Ballon -->
        <div class="balloon"> <img src="/assets/Balloon.svg" alt="balloon"> </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>



    <script src="/js/desktop.js"></script>

    <script src="/js/ui.js"></script>

</body>

</html>
