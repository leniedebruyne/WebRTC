<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller</title>
    <style>
        #touchCursor {
            position: absolute;
            width: 3rem;
            height: 3rem;
            background: blue;
            border-radius: 50%;
            pointer-events: none;
        }

        body {
            background: linear-gradient(#6894d1, #1e4fbf);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: sans-serif;
        }

        .game-ui {
            width: 300px;
            text-align: center;
            color: #D7ECFE;
        }

        .boost-section {
            margin-top: 10px;
            text-align: center;
        }

        .boost-section .title {
            font-size: 25px;
        }

        .boost-section .indicators {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #D7ECFE;
            opacity: 0.5;
            border-radius: 50%;
        }

        .boost-section .dot {
            width: 25px;
            height: 25px;
            background: #D7ECFE;
            opacity: 0.5;
            border-radius: 50%;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 35px;
            align-items: center;
        }

        .btn {
            width: 293px;
            height: 150px;
            border-radius: 20px;
            border: none;
            font-size: 25px;
            cursor: pointer;
            background: #D7ECFE;
            color: #4174AC;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grow {
            font-weight: bold;
        }

        .shrink {
            font-weight: normal;
        }

        .swipe-section {
            width: 100vw;
            margin-left: 50%;
            transform: translateX(-50%);
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 25px 0;
            text-align: center;
        }

        .swipe-section p {
            font-size: 30px;
            margin: 0 0 15px 0;
            color: #D7ECFE;
        }

        .arrow {
            width: 120px;
            height: 40px;
            background-image: url('/assets/Arrow.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="game-ui">
        <div class="boost-section">
            <p class="title">Shake for boost</p>
            <div class="indicators"> <span class="dot"></span> <span class="dot"></span> <span class="dot"></span>
            </div>
        </div>
        <div class="actions">
            <button class="btn grow">Tap to grow</button>
            <button class="btn shrink">Tap to shrink</button>
        </div>
        <div class="swipe-section">
            <p>Swipe to move</p>
            <div class="arrow"></div>
        </div>
    </div>

    <div id="touchCursor"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <script>
        const socket = io();
        const desktopId = new URLSearchParams(window.location.search).get('id');

        if (!desktopId) {
            alert("Missing desktop ID in URL!");
        }

        const $touchCursor = document.getElementById('touchCursor');

        // Controller is initiator
        const peer = new SimplePeer({
            initiator: true,
            trickle: true
        });

        // Signalling naar desktop sturen
        peer.on('signal', data => {
            socket.emit('signal', {
                targetId: desktopId,
                signal: data
            });
        });

        // Signalling ontvangen
        socket.on('signal', ({ signal }) => {
            peer.signal(signal);
        });

        peer.on('connect', () => {
            console.log("Controller connected to desktop");
        });

        // Cursor sturen
        const sendCursor = e => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            $touchCursor.style.left = `${e.clientX}px`;
            $touchCursor.style.top = `${e.clientY}px`;

            if (peer.connected) {
                peer.send(JSON.stringify({ x, y }));
            }
        };

        const handleTouch = e => {
            e.preventDefault();
            sendCursor(e.touches[0]);
        };

        window.addEventListener('mousemove', sendCursor);
        window.addEventListener('touchstart', handleTouch, { passive: false });
        window.addEventListener('touchmove', handleTouch, { passive: false });
    </script>

</body>

</html>
